name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate SEO and priority lead pages
        run: |
          python scripts/apply_indexing_policy.py
          python scripts/build_sitemap.py
          python scripts/seo_audit.py --fail-under 95
          python scripts/validate_ai_search_assets.py
          python scripts/validate_priority_lead_pages.py
          python -m unittest discover -s test -p "test_*.py"
          node --test workers/lead-concierge/test/*.test.js
      - name: Remove blocked platform references
        run: |
          python scripts/remove_public_platform_mentions.py
          python -c "from pathlib import Path; import re; path = Path('llms.txt'); text = path.read_text(encoding='utf-8'); text = re.sub(r'https?://(?:www\.)?angi\.com/[^\s)]+', 'https://allprometroeastconstruction.com/reviews.html', text, flags=re.IGNORECASE); text = re.sub(r'\bAngi\b', 'customer reviews', text, flags=re.IGNORECASE); path.write_text(text, encoding='utf-8')"
      - name: Build public site artifact
        run: python scripts/build_public_site.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow about changed pages
        run: >-
          python scripts/submit_indexnow.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
